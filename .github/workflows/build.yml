name: Android CI/CD

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Collapse superseded runs on branches and PRs. Tag runs publish the release
# artifacts and must never be cancelled by a subsequent push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: read

env:
  # Certificate of the official Flow release key. IzzyOnDroid and every
  # installed client pin this value; an APK signed with anything else cannot
  # be installed as an update. Changing it forces every user to reinstall.
  EXPECTED_SIGNER_SHA256: 4322294ed4caa2d4294140095818080ffe8acc1fbe3cdc76107df45c5286be40
  # Certificate of the nightly key. Every nightly must carry it so each one
  # installs over the previous nightly without an uninstall.
  EXPECTED_NIGHTLY_SIGNER_SHA256: e42225b5ab3ac68236e54567ef0c4878afbafcdd3d438fbaba343e2d70425bf0

# checks, tests, lint and build run on separate runners at the same time, and
# both publish jobs wait for all four. The CI Gradle properties replace the
# --max-workers=1 that #1011 needed when everything shared one runner.
jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          # Spotless ratchetFrom compares against an old commit.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Use CI Gradle properties
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      # Read-only: every job writes its own Gradle User Home entry, and the
      # repository cache is already at its 10 GB cap. This job restores from
      # the build job's entry instead.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check generated Snowball stemmers
        run: |
          sh scripts/neuro/gen_snowball.sh
          git status --porcelain -- app/src/main/java/org/tartarus/snowball
          test -z "$(git status --porcelain -- app/src/main/java/org/tartarus/snowball)"

      # The nightly job publishes these as the release body the update screen shows.
      - name: Check nightly notes
        run: python3 .github/scripts/nightly_notes.py --check

      - name: Check Kotlin formatting
        run: >
          ./gradlew spotlessCheck
          --build-cache --stacktrace

  tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Use CI Gradle properties
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Instrumentation tests are not executed in CI, but they must still
      # compile: breakage here otherwise lands on main unnoticed.
      - name: Run unit tests and compile instrumentation tests
        run: >
          ./gradlew :app:testGithubDebugUnitTest :app:testFossDebugUnitTest
          :app:compileGithubDebugAndroidTestKotlin
          --build-cache --stacktrace

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Use CI Gradle properties
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      # Read-only for the same reason as the checks job. Lint is never the
      # slowest job, so re-downloading its own dependencies costs no wall time.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Lint GitHub nightly
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: >
          ./gradlew :app:lintGithubNightly
          --build-cache --stacktrace

      - name: Lint GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: >
          ./gradlew :app:lintGithubRelease
          --build-cache --stacktrace

  # "Build APK" is the required status check in the Protect Main ruleset.
  build:
    name: Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Use CI Gradle properties
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.keystore
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Release keystore decoded."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Release keystore secret is not available. Continuing with an unsigned/debug CI build."
          fi

      - name: Decode nightly keystore
        id: nightly_keystore
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          NIGHTLY_KEYSTORE_BASE64: ${{ secrets.NIGHTLY_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$NIGHTLY_KEYSTORE_BASE64" ]; then
            echo "$NIGHTLY_KEYSTORE_BASE64" | base64 --decode > nightly.keystore
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Nightly keystore secret is not available. Continuing with debug-signed build."
          fi

      # GitHub release APKs are only published from tags, and nightly is
      # initWith(release), so regular runs build nightly in their place.
      - name: Build CI APKs
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: >
          ./gradlew :app:assembleGithubDebug :app:assembleGithubNightly :app:assembleFossRelease
          --build-cache --stacktrace
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          NIGHTLY_STORE_PASSWORD: ${{ secrets.NIGHTLY_STORE_PASSWORD }}
          NIGHTLY_KEY_ALIAS: ${{ secrets.NIGHTLY_KEY_ALIAS }}
          NIGHTLY_KEY_PASSWORD: ${{ secrets.NIGHTLY_KEY_PASSWORD }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}

      - name: Build release APKs
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: >
          ./gradlew :app:assembleGithubRelease :app:assembleGithubDebug :app:assembleFossRelease
          --build-cache --stacktrace
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}

      # Guards the IzzyOnDroid/F-Droid update path: a wrong or missing key here
      # is unrecoverable for installed users, so fail the build rather than
      # publish. Skipped when no keystore was available, e.g. on fork PRs.
      # Regular runs have only the FOSS release APKs; the nightly is checked
      # against its own key in the next step.
      - name: Verify release signing certificate
        if: ${{ steps.keystore.outputs.signed == 'true' }}
        run: |
          set -uo pipefail
          apksigner=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -1)
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner was not found in the runner Android SDK."
            exit 1
          fi

          apks=()
          if [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ]; then
            apks+=(
              app/build/outputs/apk/github/release/app-github-universal-release.apk
              app/build/outputs/apk/github/release/app-github-arm64-v8a-release.apk
              app/build/outputs/apk/github/release/app-github-armeabi-v7a-release.apk
            )
          fi
          apks+=(
            app/build/outputs/apk/foss/release/app-foss-universal-release.apk
            app/build/outputs/apk/foss/release/app-foss-arm64-v8a-release.apk
            app/build/outputs/apk/foss/release/app-foss-armeabi-v7a-release.apk
          )

          status=0
          for apk in "${apks[@]}"
          do
            if [ ! -f "$apk" ]; then
              echo "::error::Missing expected APK $apk"
              status=1
              continue
            fi
            actual=$("$apksigner" verify --print-certs "$apk" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
            if [ "$actual" != "$EXPECTED_SIGNER_SHA256" ]; then
              echo "::error::$(basename "$apk") is signed with '$actual', expected '$EXPECTED_SIGNER_SHA256'"
              status=1
            else
              echo "OK $(basename "$apk") -> $actual"
            fi
          done
          exit $status

      # The run number in the file name is how the in-app updater tells
      # nightlies apart (GitHubRelease.toNightlyReleaseIfNewer).
      - name: Verify and name nightly APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          NIGHTLY_SIGNED: ${{ steps.nightly_keystore.outputs.signed }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          src=$(ls app/build/outputs/apk/github/nightly/app-github-universal-nightly*.apk app/build/outputs/apk/github/debug/app-github-universal-debug*.apk 2>/dev/null | head -1 || true)
          if [ -n "$src" ] && [ -f "$src" ]; then
            if [ "$NIGHTLY_SIGNED" = "true" ]; then
              apksigner=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -1)
              actual=$("$apksigner" verify --print-certs "$src" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
              if [ "$actual" != "$EXPECTED_NIGHTLY_SIGNER_SHA256" ]; then
                echo "::warning::The nightly is signed with '$actual', expected '$EXPECTED_NIGHTLY_SIGNER_SHA256'"
              else
                echo "OK nightly -> $actual"
              fi
            fi
            mkdir -p dist-nightly
            cp "$src" "dist-nightly/supertube-nightly-${GITHUB_RUN_NUMBER}.apk"
            (cd dist-nightly && sha256sum supertube-nightly-*.apk | tee checksums.txt)
          fi

      - name: Report individual APK sizes
        shell: bash
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/*/*/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "No APKs found to report size."
          else
            {
              echo '## Individual APK sizes'
              echo
              echo '| APK | Size | Exact bytes |'
              echo '|---|---:|---:|'
              for apk in "${apks[@]}"; do
                bytes=$(stat --format='%s' "$apk")
                size=$(awk -v bytes="$bytes" 'BEGIN { printf "%.2f MiB", bytes / 1048576 }')
                printf '| `%s` | %s | %s |\n' "$(basename "$apk")" "$size" "$bytes"
              done
              echo
              echo '> APKs built successfully and available for download.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          foss_limit=29500000
          foss_apk=$(ls app/build/outputs/apk/foss/release/app-foss-arm64-v8a-release*.apk 2>/dev/null | head -1 || true)
          if [ -n "$foss_apk" ] && [ -f "$foss_apk" ]; then
            foss_bytes=$(stat --format='%s' "$foss_apk")
            if (( foss_bytes > foss_limit )); then
              printf 'FOSS arm64-v8a APK is %d bytes, over the %d byte budget.\n' "$foss_bytes" "$foss_limit" >&2
              exit 1
            fi
          fi

      # Universal and architecture-specific APK uploads (always produces downloadable artifacts)
      - name: Upload GitHub universal APK
        uses: actions/upload-artifact@v7
        with:
          name: supertube-github-universal-apk
          path: app/build/outputs/apk/github/release/app-github-universal-release*.apk
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0

      - name: Upload GitHub Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: supertube-github-debug-apk
          path: app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0

      - name: Upload GitHub ARM64 APK
        uses: actions/upload-artifact@v7
        with:
          name: supertube-github-arm64-release-apk
          path: app/build/outputs/apk/github/release/app-github-arm64-v8a-release*.apk
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0

      - name: Upload GitHub ARMv7 APK
        uses: actions/upload-artifact@v7
        with:
          name: supertube-github-armeabi-v7a-release-apk
          path: app/build/outputs/apk/github/release/app-github-armeabi-v7a-release*.apk
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0

      - name: Upload Nightly APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: supertube-nightly-apk
          path: dist-nightly/*
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload FOSS universal APK
        uses: actions/upload-artifact@v7
        with:
          name: supertube-foss-universal-release-apk
          path: app/build/outputs/apk/foss/release/app-foss-universal-release*.apk
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0

      - name: Upload FOSS ARM64 APK
        uses: actions/upload-artifact@v7
        with:
          name: supertube-foss-arm64-release-apk
          path: app/build/outputs/apk/foss/release/app-foss-arm64-v8a-release*.apk
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0

      - name: Upload FOSS ARMv7 APK
        uses: actions/upload-artifact@v7
        with:
          name: supertube-foss-armeabi-v7a-release-apk
          path: app/build/outputs/apk/foss/release/app-foss-armeabi-v7a-release*.apk
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0

      # Crash reports name the R8 map id in every frame; the matching mapping turns them back into
      # source lines with retrace. Kept longer than the APKs because reports arrive weeks later.
      - name: Upload R8 mappings
        uses: actions/upload-artifact@v7
        with:
          name: flow-r8-mappings
          path: app/build/outputs/mapping/*/mapping.txt
          if-no-files-found: warn
          retention-days: 90

  # A rolling prerelease under the tag "nightly". GitHub's "latest release"
  # never includes a prerelease, so stable builds never see it; nightly
  # builds read it by tag (UpdateRepository).
  nightly:
    name: Publish nightly
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
    concurrency:
      group: nightly-publish
      cancel-in-progress: false

    steps:
      - name: Checkout nightly notes
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: |
            .github/nightly-notes
            .github/scripts

      - name: Download nightly APK
        uses: actions/download-artifact@v8
        with:
          name: supertube-nightly-apk
          path: dist-nightly/

      - name: Move the nightly tag and replace its assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          apk=$(ls dist-nightly/supertube-nightly-*.apk dist-nightly/flow-nightly-*.apk 2>/dev/null | head -1 || true)
          if [ -z "$apk" ] || [ ! -f "$apk" ]; then
            echo "No nightly APK to publish."
            exit 0
          fi
          apk_name=$(basename "$apk")
          if gh release view nightly >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/nightly" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh release create nightly --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "SuperTube nightly" --notes "Rolling nightly build."
          fi
          gh release upload nightly "$apk" dist-nightly/checksums.txt --clobber
          for old in $(gh release view nightly --json assets --jq '.assets[].name'); do
            if [ "$old" != "$apk_name" ] && [ "$old" != "checksums.txt" ]; then
              gh release delete-asset nightly "$old" --yes
            fi
          done
          python3 .github/scripts/nightly_notes.py \
            --intro "Built from ${GITHUB_SHA::7} by run ${GITHUB_RUN_NUMBER}. Installs next to the stable app as SuperTube Nightly and updates itself from here." \
            > nightly-body.md || echo "SuperTube nightly ${GITHUB_RUN_NUMBER}" > nightly-body.md
          gh release edit nightly --prerelease --latest=false \
            --title "SuperTube nightly ${GITHUB_RUN_NUMBER}" \
            --notes-file nightly-body.md

  release:
    name: Create Release
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download release APKs
        uses: actions/download-artifact@v8
        with:
          pattern: supertube-*-apk
          path: dist/
          merge-multiple: true

      # Universal builds for release
      - name: Rename APKs for release
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in dist/app-github-universal-release*.apk; do cp "$f" dist/supertube.apk; break; done
          for f in dist/app-foss-universal-release*.apk; do cp "$f" dist/supertube-foss.apk; break; done
          for f in dist/app-github-arm64-v8a-release*.apk; do cp "$f" dist/supertube-arm64-v8a.apk; break; done
          for f in dist/app-github-armeabi-v7a-release*.apk; do cp "$f" dist/supertube-armeabi-v7a.apk; break; done
          for f in dist/app-foss-arm64-v8a-release*.apk; do cp "$f" dist/supertube-foss-arm64-v8a.apk; break; done
          for f in dist/app-foss-armeabi-v7a-release*.apk; do cp "$f" dist/supertube-foss-armeabi-v7a.apk; break; done

      - name: Generate checksums
        run: |
          cd dist
          sha256sum supertube*.apk > checksums.txt 2>/dev/null || sha256sum *.apk > checksums.txt
          cat checksums.txt

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Validate release notes
        env:
          RELEASE_VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          test -s release-notes.md || echo "# SuperTube ${RELEASE_VERSION}" > release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: SuperTube ${{ steps.get_version.outputs.VERSION }}
          body_path: release-notes.md
          generate_release_notes: false
          files: |
            dist/*.apk
            dist/checksums.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
