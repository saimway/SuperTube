name: Android CI/CD

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  EXPECTED_SIGNER_SHA256: b4f6b260beae66d841c68bb2ab3ecb30666c7307d3a2c082f67e5ce17d768276

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Use CI Gradle properties
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode release keystore
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.keystore
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [ -f supertube.keystore ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        run: >
          ./gradlew :app:assembleGithubRelease
          --build-cache --stacktrace
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}

      - name: Prepare release APK
        run: |
          mkdir -p dist
          src=$(ls app/build/outputs/apk/github/release/app-github-universal-release*.apk 2>/dev/null | head -1 || true)
          if [ -z "$src" ] || [ ! -f "$src" ]; then
            src=$(ls app/build/outputs/apk/github/release/*.apk 2>/dev/null | head -1 || true)
          fi
          if [ -z "$src" ] || [ ! -f "$src" ]; then
            echo "::error::No release APK found!"
            exit 1
          fi
          cp "$src" dist/supertube.apk
          cd dist
          sha256sum supertube.apk > checksums.txt
          cat checksums.txt

      - name: Verify release signing certificate
        run: |
          apksigner=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -1)
          if [ -n "$apksigner" ]; then
            actual=$("$apksigner" verify --print-certs dist/supertube.apk | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
            if [ "$actual" != "$EXPECTED_SIGNER_SHA256" ]; then
              echo "::warning::APK signed with '$actual', expected '$EXPECTED_SIGNER_SHA256'"
            else
              echo "OK supertube.apk verified with SHA256: $actual"
            fi
          fi

      - name: Upload supertube.apk artifact
        uses: actions/upload-artifact@v7
        with:
          name: supertube-release-apk
          path: dist/supertube.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: SuperTube ${{ github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: false
          files: |
            dist/supertube.apk
            dist/checksums.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
